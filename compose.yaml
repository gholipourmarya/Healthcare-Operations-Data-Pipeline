x-airflow: &airflow
  image: healthcare-airflow:local
  pull_policy: never
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: healthcare-demo-airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    DBT_HOST: postgres
    DBT_PASSWORD: warehouse
  volumes:
    - airflow-logs:/opt/airflow/logs

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - healthcare.appointments
      - --partitions
      - "3"
      - --replication-factor
      - "1"
      - --config
      - message.timestamp.type=LogAppendTime

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-healthcare.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "healthcare"]
      interval: 5s
      timeout: 5s
      retries: 20

  streaming:
    image: healthcare-streaming:local
    build:
      context: .
      dockerfile: infra/streaming.Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: healthcare.appointments
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres/healthcare
      SPARK_CHECKPOINT: /checkpoints/appointments
      PYTHONUNBUFFERED: "1"
    volumes:
      - spark-checkpoints:/checkpoints
    restart: on-failure

  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json, sys; sys.exit(not any(user["username"] == "admin" for user in json.load(sys.stdin)))'; then
          airflow users create --username admin --password admin --firstname Demo --lastname Admin --role Admin --email admin@example.com
        fi

  airflow-scheduler:
    <<: *airflow
    build:
      context: .
      dockerfile: infra/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"

  grafana:
    image: grafana/grafana:12.3.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/healthcare.yaml:ro
      - ./infra/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/healthcare.yaml:ro
      - ./infra/grafana/healthcare.json:/var/lib/grafana/dashboards/healthcare.json:ro

volumes:
  airflow-logs:
  grafana-data:
  kafka-data:
  postgres-data:
  spark-checkpoints:
